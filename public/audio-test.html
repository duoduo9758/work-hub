<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>work-hub タイマー音 試聴</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Noto Sans JP", sans-serif;
      padding: 24px 16px;
      max-width: 480px;
      margin: 0 auto;
      color: #0d0d0d;
      background: #ffffff;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .lead { color: #6b7280; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
    button {
      display: block;
      width: 100%;
      padding: 16px;
      margin: 10px 0;
      font-size: 16px;
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      border: 1px solid #ececec;
      background: #f7f7f8;
      color: #0d0d0d;
      text-align: left;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover, button:focus-visible {
      background: #ffffff;
      border-color: #18181b;
      outline: none;
    }
    button strong { font-weight: 600; display: block; margin-bottom: 4px; }
    button span { color: #6b7280; font-size: 13px; }
    .footer { color: #6b7280; font-size: 13px; line-height: 1.6; margin-top: 24px; padding-top: 16px; border-top: 1px solid #ececec; }
  </style>
</head>
<body>
  <h1>work-hub タイマー音 試聴</h1>
  <p class="lead">4つの候補を比べてください。気に入った案（A / B / C / D）を Claude に伝えてください。</p>

  <button onclick="playA()">
    <strong>A. ピピピ（現状）</strong>
    <span>880Hz × 2 → 1100Hz、計 0.6 秒。目覚まし時計風。</span>
  </button>

  <button onclick="playB()">
    <strong>B. チャイム下降（ピンポン）</strong>
    <span>E5 → C5、計 0.7 秒。エレベーター・玄関チャイム風。</span>
  </button>

  <button onclick="playC()">
    <strong>C. ベル（単音長余韻）</strong>
    <span>A5 単音、1.5 秒で減衰。瞑想ベル風、上品。</span>
  </button>

  <button onclick="playD()">
    <strong>D. メロディ上行（ピロリン）</strong>
    <span>C5 → E5 → G5、計 0.55 秒。スマホ通知風、軽快。</span>
  </button>

  <p class="footer">音量が小さい場合は、端末の音量を上げてから再度タップしてください。</p>

  <script>
    let ctx = null
    function ensureCtx() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)()
      if (ctx.state === 'suspended') ctx.resume()
      return ctx
    }
    function beep(c, start, freq, dur, vol) {
      vol = (vol == null) ? 0.3 : vol
      var osc = c.createOscillator()
      var gain = c.createGain()
      osc.connect(gain)
      gain.connect(c.destination)
      osc.type = 'sine'
      osc.frequency.setValueAtTime(freq, start)
      gain.gain.setValueAtTime(vol, start)
      gain.gain.exponentialRampToValueAtTime(0.001, start + dur)
      osc.start(start)
      osc.stop(start + dur)
    }
    function playA() {
      var c = ensureCtx(); var t = c.currentTime
      beep(c, t,        880,  0.15)
      beep(c, t + 0.20, 880,  0.15)
      beep(c, t + 0.40, 1100, 0.20)
    }
    function playB() {
      var c = ensureCtx(); var t = c.currentTime
      beep(c, t,        659, 0.30, 0.32) // E5
      beep(c, t + 0.32, 523, 0.40, 0.32) // C5
    }
    function playC() {
      var c = ensureCtx(); var t = c.currentTime
      beep(c, t, 880, 1.5, 0.4)
    }
    function playD() {
      var c = ensureCtx(); var t = c.currentTime
      beep(c, t,        523, 0.15)       // C5
      beep(c, t + 0.15, 659, 0.15)       // E5
      beep(c, t + 0.30, 784, 0.25)       // G5
    }
  </script>
</body>
</html>
